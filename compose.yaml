name: ervisiotodo
services:
  app:
    build: .
    image: ghcr.io/ervisio/ervisio-todo:${ERVISIO_VERSION:-0.3.1}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - todo-data:/app/data
      # Ervisio plugin socket (PLUGIN_SOCKET=/run/ervisio-todo/api.sock in .env).
      - ${ERVISIO_SOCKET_DIR:-./run}:/run/ervisio-todo
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
volumes:
  todo-data:
