# Release on a pushed vX.Y.Z tag (equal to package.json and plugin/plugin/manifest.json):
# the Ervisio plugin asset through the SDK's reusable workflow, and the app image on GHCR
# that the plugin's Docker install pulls (ghcr.io/ervisio/ervisio-todo:X.Y.Z).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  plugin:
    uses: Ervisio/plugin-sdk/.github/workflows/plugin-release.yml@main
    with:
      working-directory: plugin
    secrets: inherit

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ervisio/ervisio-todo:${{ env.VERSION }}
            ghcr.io/ervisio/ervisio-todo:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
