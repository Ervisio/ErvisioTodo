<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ErvisioTodo</title>
<style>
:root {
  color-scheme: light;
  --canvas: #f4f6fa; --sheet: #fff; --surface: #e7ebf2; --fg: #20252d; --dim: #5a6575;
  --line: #e1e6ee; --accent: #245ac2; --on-accent: #fff; --danger: #b3261e; --warn: #8a5a00;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --canvas: #000; --sheet: #121219; --surface: #262633; --fg: #eeeef4; --dim: #a9abba;
    --line: #2c2c3a; --accent: #9ea8ff; --on-accent: #0b0b14; --danger: #ff8a80; --warn: #f2c26b;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--canvas); color: var(--fg); font: 15px/1.5 var(--font);
  display: grid; place-items: center; padding: 24px;
}
main {
  width: 100%; max-width: 420px; background: var(--sheet); border: 1px solid var(--line);
  border-radius: 16px; padding: 32px 28px;
}
.logo { width: 44px; height: 44px; display: block; margin: 0 0 16px; }
h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
p { margin: 0 0 16px; color: var(--dim); }
label { display: block; font-size: 13px; font-weight: 600; margin: 20px 0 6px; }
input {
  width: 100%; height: 44px; padding: 0 12px; font: inherit; color: var(--fg);
  background: var(--canvas); border: 1px solid var(--line); border-radius: 12px; outline: none;
}
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; margin-top: 20px; }
button {
  flex: 1; height: 44px; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button:disabled { opacity: .6; cursor: default; }
.msg { min-height: 1.5em; margin: 10px 0 0; font-size: 13px; }
.err { color: var(--danger); }
.warn { color: var(--warn); }
.addr { font-size: 13px; word-break: break-all; padding: 8px 12px; border-radius: 8px; background: var(--canvas); margin: 12px 0 0; }
#connecting p { opacity: 0; animation: show .2s .4s forwards; margin: 0; }
@keyframes show { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #connecting p { animation-duration: 0s; } }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 44 44" aria-hidden="true">
    <rect width="44" height="44" rx="10" fill="#245ac2"/>
    <path d="M12 23l7 7 13-14" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>ErvisioTodo</h1>

  <section id="connecting"><p id="t-connecting"></p></section>

  <form id="setup" hidden>
    <p id="t-setup-sub"></p>
    <label for="addr" id="t-addr-label"></label>
    <input id="addr" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://todo.example.com">
    <div class="msg warn" id="warn" hidden></div>
    <div class="msg err" id="form-err" role="alert"></div>
    <div class="row">
      <button type="button" id="cancel" hidden></button>
      <button type="submit" id="go" class="primary"></button>
    </div>
  </form>

  <section id="error" hidden>
    <p id="err-text" class="err" role="alert" style="margin-bottom:0"></p>
    <div class="addr" id="err-addr"></div>
    <p id="err-note" style="margin-top:12px"></p>
    <div class="row">
      <button type="button" id="change"></button>
      <button type="button" id="retry" class="primary"></button>
    </div>
  </section>
</main>
<script>
(() => {
  const dict = {
    it: {
      connecting: "Connessione al server…",
      setupSub: "Inserisci l'indirizzo del tuo server ErvisioTodo.",
      addrLabel: "Indirizzo del server",
      connect: "Connetti", checking: "Verifica in corso…", cancel: "Annulla",
      httpWarn: "Connessione non cifrata (http): usala solo su reti di cui ti fidi.",
      errTitle: "Server non raggiungibile", retry: "Riprova", change: "Cambia server",
      note: "Riprovo automaticamente ogni pochi secondi.",
      bad_address: "Indirizzo non valido. Esempio: https://todo.example.com",
      unreachable: "Impossibile raggiungere il server. Controlla l'indirizzo e la connessione.",
      timeout: "Il server non risponde (tempo scaduto dopo 5 secondi).",
      certificate: "Problema con il certificato o con la connessione sicura (HTTPS).",
      not_ervisio: "L'indirizzo risponde, ma non sembra un server ErvisioTodo.",
      redirect: "Il server reindirizza a un altro indirizzo. Inserisci quello definitivo.",
      generic: "Qualcosa è andato storto. Riprova."
    },
    en: {
      connecting: "Connecting to the server…",
      setupSub: "Enter the address of your ErvisioTodo server.",
      addrLabel: "Server address",
      connect: "Connect", checking: "Checking…", cancel: "Cancel",
      httpWarn: "Unencrypted connection (http): use it only on networks you trust.",
      errTitle: "Server unreachable", retry: "Retry", change: "Change server",
      note: "Retrying automatically every few seconds.",
      bad_address: "Invalid address. Example: https://todo.example.com",
      unreachable: "Cannot reach the server. Check the address and your connection.",
      timeout: "The server is not responding (timed out after 5 seconds).",
      certificate: "Certificate or secure connection (HTTPS) problem.",
      not_ervisio: "The address answers, but it does not look like an ErvisioTodo server.",
      redirect: "The server redirects to another address. Enter the final one.",
      generic: "Something went wrong. Try again."
    }
  };
  const lang = (navigator.language || "en").toLowerCase().startsWith("it") ? "it" : "en";
  const t = (k) => dict[lang][k] || dict[lang].generic;
  document.documentElement.lang = lang;
  const $ = (id) => document.getElementById(id);
  const views = ["connecting", "setup", "error"];
  const show = (name) => views.forEach((v) => { $(v).hidden = v !== name; });

  $("t-connecting").textContent = t("connecting");
  $("t-setup-sub").textContent = t("setupSub");
  $("t-addr-label").textContent = t("addrLabel");
  $("go").textContent = t("connect");
  $("cancel").textContent = t("cancel");
  $("retry").textContent = t("retry");
  $("change").textContent = t("change");
  $("err-note").textContent = t("note");

  let local;
  let savedAddress = "";
  const wait = async () => {
    for (let i = 0; i < 60 && !(window.go && window.go.main && window.go.main.Local); i++) {
      await new Promise((r) => setTimeout(r, 50));
    }
    local = window.go && window.go.main && window.go.main.Local;
  };

  function showSetup(address) {
    $("addr").value = address || "";
    $("form-err").textContent = "";
    $("cancel").hidden = !savedAddress;
    show("setup");
    $("addr").focus();
    checkWarn();
  }

  function showError(st) {
    $("err-text").textContent = t(st.code);
    $("err-addr").textContent = st.address;
    $("retry").disabled = false;
    show("error");
    $("retry").focus();
  }

  let warnTimer;
  function checkWarn() {
    clearTimeout(warnTimer);
    warnTimer = setTimeout(async () => {
      const p = await local.Preview($("addr").value);
      $("warn").hidden = !p.warn;
      $("warn").textContent = p.warn ? t("httpWarn") : "";
    }, 250);
  }

  $("addr").addEventListener("input", checkWarn);
  $("setup").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("form-err").textContent = "";
    $("go").disabled = true;
    $("go").textContent = t("checking");
    const res = await local.Connect($("addr").value);
    if (!res.ok) {
      $("form-err").textContent = t(res.code);
      $("go").disabled = false;
      $("go").textContent = t("connect");
    }
  });
  $("cancel").addEventListener("click", () => local.Back());
  $("change").addEventListener("click", () => showSetup(savedAddress));
  $("retry").addEventListener("click", () => {
    $("retry").disabled = true;
    local.Reload();
  });

  window.addEventListener("keydown", (e) => {
    if (!local) return;
    const k = e.key;
    const ctrl = e.ctrlKey && !e.altKey;
    if (k === "F5" || (ctrl && !e.shiftKey && k.toLowerCase() === "r")) { e.preventDefault(); local.Reload(); }
    else if (ctrl && (k === "=" || k === "+")) { e.preventDefault(); local.Zoom(1); }
    else if (ctrl && k === "-") { e.preventDefault(); local.Zoom(-1); }
    else if (ctrl && k === "0") { e.preventDefault(); local.Zoom(0); }
  });

  (async () => {
    await wait();
    if (!local) return;
    const st = await local.Boot(location.origin);
    savedAddress = st.address;
    if (st.mode === "setup") showSetup(st.address);
    else if (st.mode === "error") showError(st);
  })();
})();
</script>
</body>
</html>
